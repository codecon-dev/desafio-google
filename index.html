<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Desafio</title>
  <style>
    :root {
      --cor-1: #34a853;
      --cor-2: #202124;
      --cor-3: #ea4335;
      --cor-4: #ff6d00;
      --cor-5: #4285f4;
      --cor-6: #dfe1e5;
      --cor-7: #fbbc05;
      --cor-8: #7b1fa2;
      --cor-9: #70757a;
      --cor-10: #f2f2f2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    header {
      display: flex;
      width: 100%;

      justify-content: flex-end;
    }
    span {
      font-size: 32px;
    }

    span:nth-child(1) {
      color: var(--cor-5);
    }

    span:nth-child(2) {
      color: var(--cor-3);
    }

    span:nth-child(3) {
      color: var(--cor-7);
    }

    span:nth-child(4) {
      color: var(--cor-5);
    }

    span:nth-child(5) {
      color: var(--cor-1);
    }
    span:nth-child(6) {
      color: var(--cor-3);
    }
    .input {
      display: flex;
      margin: 16px auto;
      border-radius: 99px;
      outline: 1px solid var(--cor-6);
      width: min(90%, 584px);
      justify-content: center;
    }
    .container {
      margin-top: 35vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    body {
      height: 100%;
    }
    footer {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      background-color: var(--cor-10);
      color: var(--cor-9);
      font-size: 14px;
    }
    .footer-top {
      padding: 15px 30px 12px;
      border-bottom: 1px solid #dadce0;
    }
    .footer-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 30px 15px;
      gap: 20px;
      flex-wrap: wrap;
    }


  </style>
</head>
<body>
    <header><img class="icone-03" src="assets/icones/icone-03.svg" /><button style="background-color: var(--cor-5); color: white; border: none; padding: 8px 16px; border-radius: 40px; cursor: pointer;">Fazer login</button></header>
  <div class="container">
    <span>G</span>
    <span>o</span>

    <span>o</span>
    <span>g</span>
    <span>l</span>
    <span>e</span>
  </div>
  <div class="input">
    <img src="assets/icones/icone-06.svg" />
    <input />
    <img src="assets/icones/icone-02.svg" />
    <img src="assets/icones/icone-05.svg" />
  </div>
  <footer>
    <div class="footer-top">Brasil</div>
    <div class="footer-bottom">
      <div class="footer-menu">
        <a href="#">Sobre</a>
        <a href="#">Publicidade</a>
        <a href="#">Negócios</a>
        <a href="#">Como funciona a Pesquisa</a>
      </div>

      <div class="footer-menu-right">
        <a href="#">Privacidade</a>
        <a href="#">Termos</a>
        <a href="#">Configurações</a>
      </div>
    </div>
  </footer>
</body>
</html>

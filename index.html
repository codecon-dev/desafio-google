<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desafio</title>
    <style>
            :root {
              --cor-1: #34a853;
              --cor-2: #202124;
              --cor-3: #ea4335;
              --cor-4: #ff6d00;
              --cor-5: #4285f4;
              --cor-6: #dfe1e5;
              --cor-7: #fbbc05;
              --cor-8: #7b1fa2;
              --cor-9: #70757a;
              --cor-10: #f2f2f2;
            }

            * {
              margin: 0;
              padding: 0;
              box-sizing: border-box;
            }
            header {
              display: flex;
              width: 100%;

              justify-content: right !important;
            }
            span {
              font-size: 32px;
            }

            span:nth-child(1) {
              color: var(--cor-5);
            }

            span:nth-child(2) {
              color: var(--cor-3);
            }

            span:nth-child(3) {
              color: var(--cor-7);
            }

            span:nth-child(4) {
              color: var(--cor-1);
            }

            span:nth-child(5) {
              color: var(--cor-4);
            }
            span:nth-child(6) { color: var(--cor-3); }
            .input {
              display: flex;

              border-radius: 99px;
              outline: 1px solid #000000
              width: 200px
      ;
                      justify-content: center;
            }
            .container {
              display: flex;
              justify-content: center;
              align-items: center;
            }

            body {
              height: 100%;
            }
    </style>
  </head>
  <body>
    <header><img class="icone-03" src="assets/icones/icone-03.svg" /></header>
    <div class="container">
      <span>G</span>
      <span>o</span>

      <span>o</span>
      <span>g</span>
      <span>l</span>
      <span>e</span>
    </div>
    <div class="input">
      <img src="assets/icones/icone-06.svg" />
      <input />
      <img src="assets/icones/icone-02.svg" />
      <img src="assets/icones/icone-05.svg" />
    </div>
    <footer style="font-size: 15px;padding: 15px 30px;background-color: var(--cor-10);position:fixed;bottom:0;width:100%;">Brasil</footer>
  </body>
</html>
